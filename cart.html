<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Melody Restaurant</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .page-header {
      padding-top: var(--nav-h);
      background: transparent;
      padding-inline: 24px;
    }
    .page-header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
      gap: 16px; padding: 40px 0 32px; border-bottom: 1px solid var(--bdr);
    }
    .page-header h1 { font-size: clamp(1.8rem, 3vw, 2.6rem); font-weight: 600; }
    .page-header h1 em { font-style: italic; font-weight: 300; color: var(--gold-lt); }
    .page-header-sub { font-size: 0.88rem; color: var(--text-dim); margin-top: 4px; }

    .cart-layout {
      max-width: 1100px; margin: 36px auto;
      padding: 0 24px;
      display: grid; grid-template-columns: 1fr 340px;
      gap: 28px; align-items: start;
    }
    .cart-items-list { display: flex; flex-direction: column; gap: 10px; }
    .cart-item {
      background: var(--glass-1); border: 1px solid var(--bdr);
      border-radius: var(--r-md); padding: 18px;
      display: flex; align-items: center; gap: 14px;
      transition: border-color var(--t), box-shadow var(--t);
    }
    .cart-item:hover { border-color: var(--bdr-gold); box-shadow: var(--glow); }
    .cart-item-emoji {
      width: 60px; height: 60px; flex-shrink: 0;
      background: linear-gradient(135deg, rgba(232,168,56,0.08), transparent);
      border: 1px solid var(--bdr); border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center; font-size: 1.9rem;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; color: var(--text); font-family: var(--font-display); }
    .cart-item-info .item-meta { display: flex; align-items: center; gap: 8px; }
    .cart-item-info .unit-price { font-size: 0.78rem; color: var(--text-dim); }
    .cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .cart-item-total { font-family: var(--font-mono); font-weight: 700; color: var(--gold-lt); font-size: 0.95rem; }
    .btn-remove {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 0.76rem; padding: 4px;
      transition: color var(--t); display: flex; align-items: center; gap: 4px;
    }
    .btn-remove:hover { color: var(--chili); }

    .order-summary {
      background: var(--glass-1); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); padding: 24px;
      position: sticky; top: calc(var(--nav-h) + 16px);
    }
    .order-summary h3 {
      font-size: 1rem; font-weight: 600; margin-bottom: 20px;
      padding-bottom: 14px; border-bottom: 1px solid var(--bdr); color: var(--text);
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; font-size: 0.88rem;
    }
    .summary-row.total {
      border-top: 1px solid var(--bdr); margin-top: 8px;
      padding-top: 16px; font-weight: 700; font-size: 1rem;
    }
    .summary-row .label { color: var(--text-soft); }
    .summary-row .value { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
    .summary-row.total .value { color: var(--gold-lt); font-size: 1.15rem; }
    .free-delivery-notice {
      background: rgba(61,122,92,0.10); color: var(--herb-lt);
      border: 1px solid rgba(61,122,92,0.25); border-radius: var(--r-sm);
      padding: 10px 14px; font-size: 0.80rem; font-weight: 600;
      margin: 12px 0; display: flex; align-items: center; gap: 6px;
    }
    .min-order-warning {
      background: rgba(212,82,28,0.08); color: #FFAD80;
      border: 1px solid rgba(212,82,28,0.25); border-radius: var(--r-sm);
      padding: 10px 14px; font-size: 0.80rem; font-weight: 600; margin: 12px 0;
    }
    .checkout-btn { width: 100%; margin-top: 14px; }
    .promo-row { display: flex; gap: 8px; margin: 12px 0; }
    .promo-row input {
      flex: 1; padding: 9px 14px; background: var(--glass-1);
      border: 1px solid var(--bdr); border-radius: var(--r-sm);
      font-size: 0.88rem; font-family: var(--font-body); color: var(--text); outline: none;
      transition: border-color var(--t);
    }
    .promo-row input::placeholder { color: var(--text-dim); }
    .promo-row input:focus { border-color: var(--gold); }
    .promo-row button {
      padding: 9px 16px; background: var(--glass-2); color: var(--text);
      border: 1px solid var(--bdr); border-radius: var(--r-sm);
      font-weight: 600; font-size: 0.82rem; cursor: pointer;
      font-family: var(--font-body); transition: border-color var(--t), background var(--t);
    }
    .promo-row button:hover { border-color: var(--bdr-gold); background: var(--glass-3); }
    .promo-applied { color: var(--herb-lt); font-size: 0.80rem; font-weight: 600; margin-bottom: 8px; }

    .upsell { margin-top: 28px; }
    .upsell h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: var(--text); }
    .upsell-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .upsell-item {
      flex-shrink: 0; background: var(--glass-1);
      border: 1px solid var(--bdr); border-radius: var(--r-md);
      padding: 14px; text-align: center; width: 120px; cursor: pointer;
      transition: border-color var(--t), transform var(--t);
    }
    .upsell-item:hover { border-color: var(--bdr-gold); transform: translateY(-2px); }
    .upsell-item .emoji { font-size: 1.8rem; margin-bottom: 6px; }
    .upsell-item .name { font-size: 0.74rem; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .upsell-item .price { font-family: var(--font-mono); font-size: 0.74rem; color: var(--gold-lt); }
    .upsell-item button {
      margin-top: 8px; padding: 4px 10px;
      background: linear-gradient(135deg, var(--gold), var(--ember));
      color: #07070E; border: none; border-radius: var(--r-full);
      font-size: 0.72rem; cursor: pointer; font-weight: 700; font-family: var(--font-body);
    }

    @media (max-width: 768px) { .cart-layout { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      .page-header { padding-inline: 16px; }
      .cart-layout { padding: 16px; gap: 20px; margin-top: 16px; }
      .cart-item { padding: 14px; gap: 10px; flex-wrap: wrap; }
      .cart-item-emoji { width: 52px; height: 52px; font-size: 1.6rem; }
      .cart-item-right { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; width: 100%; justify-content: space-between; }
      .order-summary { padding: 16px; position: static; }
      .upsell-item { width: 105px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="Melody Logo.png" alt="Melody" onerror="this.style.display='none'" />
        Melody<span>.</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="tracking.html">Track Order</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="cart.html" class="cart-btn">
          <span>🛒</span>
          <span class="hide-xs">Cart</span>
          <span class="cart-badge">0</span>
        </a>
        <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu" onclick="closeMenu(event)">
    <div class="mobile-menu-panel">
      <a href="index.html">🏠 Home</a>
      <a href="menu.html">🍛 Menu</a>
      <a href="tracking.html">📍 Track Order</a>
      <a href="cart.html" class="menu-cart-btn active">🛒 Your Cart</a>
    </div>
  </div>

  <div class="page-header">
    <div class="page-header-inner">
      <div>
        <h1>Your <em>Cart</em></h1>
        <p class="page-header-sub" id="cartSubtitle"></p>
      </div>
      <a href="menu.html" class="btn btn-outline">+ Add More Items</a>
    </div>
  </div>

  <div id="cartContent"></div>

  <script src="app.js"></script>
  <script>
    const PROMO_CODES = { 'WELCOME10': 10, 'SPICY20': 20, 'MELODY': 15 };
    let promoDiscount = 0;
    let promoLabel = '';

    function applyPromo() {
      const code = document.getElementById('promoInput').value.trim().toUpperCase();
      const pct = PROMO_CODES[code];
      if (pct) {
        promoDiscount = pct;
        promoLabel = code;
        showToast(`Promo code applied! ${pct}% off`, 'success');
        renderCart();
      } else {
        showToast('Invalid promo code', 'error');
      }
    }

    function renderCart() {
      const cart = getCart();
      const content = document.getElementById('cartContent');

      if (!cart.length) {
        content.innerHTML = `
          <div class="container" style="padding:64px 24px;">
            <div class="empty-state">
              <div class="empty-icon">🛒</div>
              <h3>Your cart is empty</h3>
              <p>Looks like you haven't added anything yet. Let's fix that!</p>
              <a href="menu.html" class="btn btn-primary btn-lg">Browse Menu</a>
            </div>
          </div>`;
        document.getElementById('cartSubtitle').textContent = '0 items';
        return;
      }

      const subtotal = getCartTotal();
      const discount = promoDiscount > 0 ? (subtotal * promoDiscount / 100) : 0;
      const discountedSubtotal = subtotal - discount;
      const delivery = getDeliveryFee(discountedSubtotal);
      const total = discountedSubtotal + delivery;
      const canCheckout = subtotal >= MIN_ORDER;

      document.getElementById('cartSubtitle').textContent = `${getCartCount()} item${getCartCount() > 1 ? 's' : ''} · ${formatPrice(subtotal)}`;

      const cartItemsHtml = cart.map(c => {
        const item = MENU_DATA.find(i => i.id === c.id);
        if (!item) return '';
        return `
          <div class="cart-item">
            <div class="cart-item-emoji">${item.emoji}</div>
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <div class="item-meta">
                <span class="badge ${item.veg ? 'badge-veg' : 'badge-nonveg'}">${item.veg ? '🟢' : '🔴'}</span>
                <span class="unit-price">${formatPrice(item.price)} each</span>
              </div>
            </div>
            <div class="cart-item-right">
              <div class="cart-item-total">${formatPrice(item.price * c.qty)}</div>
              <div class="qty-control">
                <button onclick="changeQty(${item.id}, ${c.qty - 1})">−</button>
                <span>${c.qty}</span>
                <button onclick="changeQty(${item.id}, ${c.qty + 1})">+</button>
              </div>
              <button class="btn-remove" onclick="handleRemove(${item.id})">🗑 Remove</button>
            </div>
          </div>`;
      }).join('');

      const inCartIds = cart.map(c => c.id);
      const upsellItems = MENU_DATA.filter(i => (i.category === 'breads' || i.category === 'drinks') && !inCartIds.includes(i.id)).slice(0, 5);

      content.innerHTML = `
        <div class="cart-layout">
          <div>
            <div class="cart-items-list">${cartItemsHtml}</div>
            ${upsellItems.length ? `
            <div class="upsell">
              <h4>🍽️ Goes Well With…</h4>
              <div class="upsell-grid">
                ${upsellItems.map(u => `
                  <div class="upsell-item" onclick="handleUpsellAdd(${u.id})">
                    <div class="emoji">${u.emoji}</div>
                    <div class="name">${u.name}</div>
                    <div class="price">${formatPrice(u.price)}</div>
                    <button>＋ Add</button>
                  </div>`).join('')}
              </div>
            </div>` : ''}
          </div>

          <div>
            <div class="order-summary">
              <h3>Order Summary</h3>

              <div class="summary-row">
                <span class="label">Subtotal (${getCartCount()} items)</span>
                <span class="value">${formatPrice(subtotal)}</span>
              </div>
              ${discount > 0 ? `
              <div class="summary-row" style="color:var(--herb-lt)">
                <span>Promo (${promoLabel} −${promoDiscount}%)</span>
                <span class="value">−${formatPrice(discount)}</span>
              </div>` : ''}
              <div class="summary-row">
                <span class="label">Delivery</span>
                <span class="value" style="color:var(--herb-lt);font-weight:700;">🏔️ Complimentary</span>
              </div>

              ${!canCheckout ? `
              <div class="min-order-warning">⚠️ WEF exclusive: Minimum order is CHF ${MIN_ORDER.toFixed(2)}. Add ${formatPrice(MIN_ORDER - subtotal)} more.</div>` : ''}
              ${canCheckout ? `<div class="free-delivery-notice">✅ WEF Davos complimentary delivery included!</div>` : ''}

              <div class="summary-row total">
                <span>Total</span>
                <span class="value">${formatPrice(total)}</span>
              </div>

              <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--bdr);">
                <div style="font-size:0.72rem; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:8px;">Promo Code</div>
                ${promoDiscount > 0 ? `<div class="promo-applied">✅ ${promoLabel} applied (${promoDiscount}% off)</div>` : ''}
                <div class="promo-row">
                  <input type="text" id="promoInput" placeholder="Enter code…" value="${promoLabel}" ${promoDiscount > 0 ? 'disabled' : ''} />
                  ${promoDiscount === 0 ? `<button onclick="applyPromo()">Apply</button>` : `<button onclick="removePromo()">Remove</button>`}
                </div>
                <div style="font-size:0.73rem;color:var(--text-dim);">Try: WELCOME10, SPICY20, MELODY</div>
              </div>

              <a href="${canCheckout ? 'checkout.html' : '#'}" class="btn btn-primary btn-lg checkout-btn" ${!canCheckout ? 'style="opacity:0.5;pointer-events:none;"' : ''}>
                ${canCheckout ? 'Proceed to Checkout →' : `Min order CHF ${MIN_ORDER}`}
              </a>
              <a href="menu.html" class="btn btn-secondary checkout-btn" style="margin-top:8px;text-align:center;">← Continue Shopping</a>
            </div>
          </div>
        </div>`;
    }

    function changeQty(id, qty) {
      updateQty(id, qty);
      renderCart();
    }

    function handleRemove(id) {
      removeFromCart(id);
      renderCart();
    }

    function handleUpsellAdd(id) {
      addToCart(id);
      renderCart();
    }

    function removePromo() {
      promoDiscount = 0;
      promoLabel = '';
      renderCart();
    }

    renderCart();

    function toggleMenu() {
      document.getElementById('hamburger').classList.toggle('open');
      document.getElementById('mobileMenu').classList.toggle('open');
      document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('open') ? 'hidden' : '';
    }
    function closeMenu(e) {
      if (e.target === document.getElementById('mobileMenu')) {
        document.getElementById('hamburger').classList.remove('open');
        document.getElementById('mobileMenu').classList.remove('open');
        document.body.style.overflow = '';
      }
    }
  </script>
</body>
</html>

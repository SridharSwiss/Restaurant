<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEF Exclusive Menu — Melody × Davos 2027</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Menu Hero ── */
    .menu-hero {
      padding-top: var(--nav-h);
      padding-bottom: 0;
      text-align: center;
      padding-inline: 24px;
    }
    .menu-hero-inner {
      padding: 56px 0 0;
      border-bottom: 1px solid var(--bdr);
    }
    .menu-hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--glass-2); border: 1px solid var(--bdr-gold);
      color: var(--gold-lt); padding: 6px 16px;
      border-radius: var(--r-full); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 20px;
    }
    .menu-hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 600; margin-bottom: 12px;
    }
    .menu-hero h1 em {
      font-style: italic; font-weight: 300;
      background: linear-gradient(135deg, var(--gold), var(--ember));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .menu-hero p { font-size: 0.95rem; max-width: 460px; margin: 0 auto 32px; }

    /* ── Toolbar ── */
    .menu-toolbar {
      position: sticky; top: var(--nav-h); z-index: 90;
      background: rgba(7,7,14,0.80);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--bdr);
    }
    .menu-toolbar-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .category-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 0; scrollbar-width: none; }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--r-full);
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      border: 1px solid var(--bdr); background: var(--glass-1);
      color: var(--text-soft); font-family: var(--font-body); transition: all var(--t);
    }
    .cat-tab:hover { border-color: var(--bdr-gold); color: var(--text); background: var(--glass-2); }
    .cat-tab.active {
      background: linear-gradient(135deg, var(--gold), var(--ember));
      color: #07070E; border-color: transparent; font-weight: 700;
    }
    .filter-row { display: flex; align-items: center; gap: 10px; padding: 10px 0 14px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; position: relative; }
    .search-box input {
      width: 100%; padding: 9px 16px 9px 38px;
      background: var(--glass-1); border: 1px solid var(--bdr);
      border-radius: var(--r-full); font-size: 0.88rem; font-family: var(--font-body);
      color: var(--text); outline: none; transition: border-color var(--t), background var(--t);
    }
    .search-box input::placeholder { color: var(--text-dim); }
    .search-box input:focus { border-color: var(--gold); background: var(--glass-2); }
    .search-box::before {
      content: '🔍'; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 0.82rem;
    }
    .filter-chip {
      display: flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: var(--r-full); font-size: 0.82rem; font-weight: 600; cursor: pointer;
      border: 1px solid var(--bdr); background: var(--glass-1);
      color: var(--text-soft); font-family: var(--font-body); transition: all var(--t);
    }
    .filter-chip:hover { border-color: var(--bdr-gold); color: var(--text); }
    .filter-chip.active {
      background: rgba(61,122,92,0.18); color: var(--herb-lt); border-color: rgba(61,122,92,0.35);
    }

    /* ── Menu Layout ── */
    .menu-layout { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    .menu-section { margin-bottom: 60px; }
    .menu-section-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--bdr);
    }
    .menu-section-header h2 { font-size: 1.4rem; font-weight: 600; color: var(--text); }
    .menu-section-emoji { font-size: 1.4rem; }
    .menu-section-count { font-size: 0.78rem; color: var(--text-dim); margin-left: auto; }
    .menu-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }

    .menu-item {
      background: var(--glass-1); border: 1px solid var(--bdr);
      border-radius: var(--r-md); padding: 18px;
      display: flex; gap: 14px; align-items: flex-start;
      transition: border-color var(--t), box-shadow var(--t), transform var(--t);
    }
    .menu-item:hover { border-color: var(--bdr-gold); box-shadow: var(--glow); transform: translateY(-2px); }
    .menu-item-emoji {
      width: 68px; height: 68px; flex-shrink: 0;
      background: linear-gradient(135deg, rgba(232,168,56,0.08), rgba(7,7,14,0));
      border: 1px solid var(--bdr); border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center; font-size: 2.1rem;
    }
    .menu-item-info { flex: 1; min-width: 0; }
    .menu-item-meta { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; flex-wrap: wrap; }
    .menu-item-info h3 { font-size: 0.98rem; font-weight: 600; color: var(--text); margin-bottom: 4px; font-family: var(--font-display); }
    .menu-item-info p { font-size: 0.80rem; line-height: 1.55; margin-bottom: 12px; }
    .menu-item-footer { display: flex; align-items: center; justify-content: space-between; }
    .item-price { font-family: var(--font-mono); font-weight: 700; color: var(--gold-lt); font-size: 0.95rem; }
    .add-control { display: flex; align-items: center; gap: 6px; }

    /* ── Floating cart ── */
    .floating-cart {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(13,13,27,0.92); backdrop-filter: blur(20px);
      border: 1px solid var(--bdr-gold); color: var(--text);
      padding: 14px 24px; border-radius: var(--r-full);
      box-shadow: var(--sh-lg), var(--glow); display: none;
      align-items: center; gap: 20px; z-index: 200; cursor: pointer;
      transition: transform 0.3s var(--ease), box-shadow 0.3s;
      min-width: 300px; justify-content: space-between;
    }
    .floating-cart.visible { display: flex; }
    .floating-cart:hover { transform: translateX(-50%) translateY(-3px); box-shadow: var(--sh-lg), var(--glow-strong); }
    .fc-left { display: flex; align-items: center; gap: 12px; }
    .fc-count {
      background: linear-gradient(135deg, var(--gold), var(--ember));
      color: #07070E; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 700;
    }
    .fc-label { font-weight: 600; font-size: 0.9rem; }
    .fc-right { font-family: var(--font-mono); font-weight: 700; color: var(--gold-lt); font-size: 0.9rem; }
    .fc-arrow { color: var(--gold); }

    .hidden { display: none !important; }
    .menu-empty { text-align: center; padding: 64px 24px; }
    .menu-empty .empty-icon { font-size: 2.8rem; margin-bottom: 12px; opacity: 0.5; }
    .menu-empty p { font-size: 0.9rem; }

    @media (max-width: 640px) {
      .menu-toolbar { top: 60px; }
      .menu-toolbar-inner { padding: 0 12px; }
      .category-tabs { padding: 10px 0 0; gap: 5px; }
      .cat-tab { padding: 7px 12px; font-size: 0.78rem; }
      .filter-row { padding: 8px 0 12px; gap: 6px; }
      .search-box { min-width: unset; }
      .filter-chip { padding: 7px 10px; font-size: 0.78rem; }
      .menu-layout { padding: 20px 12px; }
      .menu-items-grid { grid-template-columns: 1fr; gap: 10px; }
      .menu-item { padding: 14px; gap: 10px; }
      .menu-item-emoji { width: 56px; height: 56px; font-size: 1.75rem; }
      .floating-cart { bottom: 16px; min-width: unset; width: calc(100% - 32px); left: 16px; right: 16px; transform: none; border-radius: var(--r-md); }
      .floating-cart:hover { transform: translateY(-2px); }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="Melody Logo.png" alt="Melody" onerror="this.style.display='none'" />
        Melody<span>.</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html" class="active">Menu</a></li>
        <li><a href="tracking.html">Track Order</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="cart.html" class="cart-btn">
          <span>🛒</span>
          <span class="hide-xs">Cart</span>
          <span class="cart-badge">0</span>
        </a>
        <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu" onclick="closeMenu(event)">
    <div class="mobile-menu-panel">
      <a href="index.html">🏠 Home</a>
      <a href="menu.html" class="active">🍛 Menu</a>
      <a href="tracking.html">📍 Track Order</a>
      <a href="cart.html" class="menu-cart-btn">🛒 View Cart</a>
    </div>
  </div>

  <div class="menu-hero">
    <div class="menu-hero-inner anim-up">
      <div class="menu-hero-badge">🏔️ WEF Davos 2027 · Exclusive Edition · Jan 19–23</div>
      <h1>WEF <em>Exclusive</em> Menu</h1>
      <p>Premium Indian cuisine for World Economic Forum delegates. Minimum order CHF 250 · Complimentary Davos delivery.</p>
    </div>
  </div>

  <div class="menu-toolbar">
    <div class="menu-toolbar-inner">
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="filter-row">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search dishes…" />
        </div>
        <button class="filter-chip" id="vegFilter" onclick="toggleVeg()">🟢 Veg Only</button>
        <button class="filter-chip" id="popularFilter" onclick="togglePopular()">⭐ Popular</button>
      </div>
    </div>
  </div>

  <div class="menu-layout" id="menuLayout"></div>

  <!-- Floating cart -->
  <div class="floating-cart" id="floatingCart" onclick="location.href='cart.html'">
    <div class="fc-left">
      <div class="fc-count" id="fcCount">0</div>
      <div class="fc-label">View Cart</div>
    </div>
    <div class="fc-right" id="fcTotal">CHF 0.00</div>
    <div class="fc-arrow">→</div>
  </div>

  <script src="app.js"></script>
  <script>
    let activeCategory = 'all';
    let vegOnly = false;
    let popularOnly = false;

    // Category tabs
    document.getElementById('categoryTabs').innerHTML = CATEGORIES.map(c => `
      <button class="cat-tab ${c.id === 'all' ? 'active' : ''}" onclick="setCategory('${c.id}')">
        ${c.emoji} ${c.label}
      </button>
    `).join('');

    function setCategory(id) {
      activeCategory = id;
      document.querySelectorAll('.cat-tab').forEach((t, i) => t.classList.toggle('active', CATEGORIES[i].id === id));
      renderMenu();
      if (id !== 'all') {
        const section = document.querySelector(`[data-category="${id}"]`);
        if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function toggleVeg() {
      vegOnly = !vegOnly;
      document.getElementById('vegFilter').classList.toggle('active', vegOnly);
      renderMenu();
    }
    function togglePopular() {
      popularOnly = !popularOnly;
      document.getElementById('popularFilter').classList.toggle('active', popularOnly);
      renderMenu();
    }

    document.getElementById('searchInput').addEventListener('input', renderMenu);

    function getFilteredItems() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      return MENU_DATA.filter(i => {
        if (activeCategory !== 'all' && i.category !== activeCategory) return false;
        if (vegOnly && !i.veg) return false;
        if (popularOnly && !i.popular) return false;
        if (q && !i.name.toLowerCase().includes(q) && !i.desc.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function renderMenu() {
      const items = getFilteredItems();
      const layout = document.getElementById('menuLayout');
      if (!items.length) {
        layout.innerHTML = `<div class="menu-empty"><div class="empty-icon">🔍</div><p>No dishes match your search. Try adjusting your filters.</p></div>`;
        return;
      }

      // Group by category (respecting active filter)
      const cats = activeCategory === 'all'
        ? CATEGORIES.filter(c => c.id !== 'all')
        : CATEGORIES.filter(c => c.id === activeCategory);

      layout.innerHTML = cats.map(cat => {
        const catItems = items.filter(i => i.category === cat.id);
        if (!catItems.length) return '';
        return `
          <div class="menu-section" data-category="${cat.id}">
            <div class="menu-section-header">
              <span class="menu-section-emoji">${cat.emoji}</span>
              <h2>${cat.label}</h2>
              <span class="menu-section-count">${catItems.length} item${catItems.length > 1 ? 's' : ''}</span>
            </div>
            <div class="menu-items-grid">
              ${catItems.map(d => renderItem(d)).join('')}
            </div>
          </div>`;
      }).join('');

      updateItemControls();
    }

    function renderItem(d) {
      return `
        <div class="menu-item scroll-reveal" id="item-${d.id}">
          <div class="menu-item-emoji">${d.emoji}</div>
          <div class="menu-item-info">
            <div class="menu-item-meta">
              <span class="badge ${d.veg ? 'badge-veg' : 'badge-nonveg'}">${d.veg ? '🟢' : '🔴'}</span>
              ${d.popular ? '<span class="badge badge-popular">⭐ Popular</span>' : ''}
              ${d.spice > 0 ? `<span class="spice-badge">${'🌶️'.repeat(d.spice)}</span>` : ''}
            </div>
            <h3>${d.name}</h3>
            <p>${d.desc}</p>
            <div class="menu-item-footer">
              <span class="item-price">${formatPrice(d.price)}</span>
              <div class="add-control" id="ctrl-${d.id}"></div>
            </div>
          </div>
        </div>`;
    }

    function updateItemControls() {
      const cart = getCart();
      MENU_DATA.forEach(d => {
        const ctrl = document.getElementById(`ctrl-${d.id}`);
        if (!ctrl) return;
        const cartItem = cart.find(c => c.id === d.id);
        if (cartItem) {
          ctrl.innerHTML = `
            <div class="qty-control">
              <button onclick="changeQty(${d.id}, -1)">−</button>
              <span>${cartItem.qty}</span>
              <button onclick="changeQty(${d.id}, 1)">+</button>
            </div>`;
        } else {
          ctrl.innerHTML = `<button class="btn-add" onclick="handleAdd(${d.id})">&#xFF0B; Add</button>`;
        }
      });
      updateFloatingCart();
    }

    function handleAdd(id) {
      addToCart(id);
      updateItemControls();
    }

    function changeQty(id, delta) {
      const cart = getCart();
      const item = cart.find(c => c.id === id);
      if (item) updateQty(id, item.qty + delta);
      updateItemControls();
    }

    function updateFloatingCart() {
      const count = getCartCount();
      const total = getCartTotal();
      const fc = document.getElementById('floatingCart');
      document.getElementById('fcCount').textContent = count;
      document.getElementById('fcTotal').textContent = formatPrice(total);
      fc.classList.toggle('visible', count > 0);
    }

    // Override showToast to also refresh controls
    const _origAdd = addToCart;
    window.addToCart = function(id, qty) {
      _origAdd(id, qty);
      updateItemControls();
    };

    const _origRenderMenu = renderMenu;
    function renderMenu() { _origRenderMenu(); setTimeout(initScrollReveal, 50); }
    renderMenu();

    function toggleMenu() {
      document.getElementById('hamburger').classList.toggle('open');
      document.getElementById('mobileMenu').classList.toggle('open');
      document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('open') ? 'hidden' : '';
    }
    function closeMenu(e) {
      if (e.target === document.getElementById('mobileMenu')) {
        document.getElementById('hamburger').classList.remove('open');
        document.getElementById('mobileMenu').classList.remove('open');
        document.body.style.overflow = '';
      }
    }
  </script>
</body>
</html>
